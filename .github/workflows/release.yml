name: Release

# Thin caller: the publishing logic lives in trajectonomics/cicd and is shared by every package.
# npm trusted publishing validates THIS file's name, so keep it called release.yml.
#
#   push to main    -> publishes an alpha (dist-tag "alpha")
#   Run workflow    -> publishes a stable version (dist-tag "latest"), then creates the
#                      tag vX.Y.Z and the GitHub release. Run it from main.
#
# package.json "version" is never edited by hand. bump = auto reads commit messages
# since the last release; pick major to cut 1.0.0.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. auto reads commit messages since the last release.
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: trajectonomics/cicd/.github/workflows/publish.yml@v1
    with:
      bump: ${{ inputs.bump || 'auto' }}
    secrets: inherit
