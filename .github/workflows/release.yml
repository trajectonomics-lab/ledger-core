name: Release

# Every push to main publishes an alpha (npm dist-tag "alpha"). Running this
# workflow by hand on main publishes the stable version (dist-tag "latest"),
# tags vX.Y.Z and creates a GitHub release. Versions are computed by
# scripts/version.ts from git tags and commit messages; package.json "version"
# is never edited by hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. auto reads commit messages since the last release."
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag + GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'alpha' }}
      DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && 'latest' || 'alpha' }}
      BUMP: ${{ inputs.bump || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and commit messages drive the version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Compute version
        id: version
        run: |
          VERSION=$(bun scripts/version.ts --channel "$CHANNEL" --bump "$BUMP")
          echo "Publishing $VERSION as $DIST_TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: npm publish --tag "$DIST_TAG" --provenance

      - name: Tag and GitHub release
        if: env.CHANNEL == 'stable'
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
